<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111111">
  <title>Ditty Revival</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <span class="eyebrow">DITTY REVIVAL</span>
        <h1>Make something sing.</h1>
        <p>Turn your words into a short animated lyric video.</p>
      </div>
    </header>

    <section class="creator-grid">
      <div class="panel">
        <label for="lyrics">Your lyrics</label>
        <textarea id="lyrics" placeholder="Type something ridiculous..."></textarea>

        <label for="song">Song</label>
        <select id="song">
          <option value="neon">Neon Nights — Original</option>
          <option value="pixel">Pixel Run — Original</option>
          <option value="goofy">Goofy Groove — Original</option>
        </select>

        <label for="voice">Singing voice</label>
        <select id="voice">
          <option>Nova</option>
          <option>Alex</option>
          <option>Mia</option>
        </select>

        <div class="row">
          <label class="file-button">
            Add background
            <input id="background" type="file" accept="image/*,video/mp4,video/webm,video/quicktime">
          </label>
          <button id="clearBackground" class="secondary">Clear</button>
        </div>

        <details>
          <summary>Caption settings</summary>
          <div class="settings">
            <label>
              Font size
              <input id="fontSize" type="range" min="20" max="72" value="42">
            </label>
            <label>
              Caption position
              <select id="captionPosition">
                <option value="center">Center</option>
                <option value="lower">Lower</option>
                <option value="upper">Upper</option>
              </select>
            </label>
            <label>
              Animation
              <select id="captionAnimation">
                <option value="pop">Pop</option>
                <option value="fade">Fade</option>
                <option value="none">None</option>
              </select>
            </label>
          </div>
        </details>

        <button id="generate" class="generate">Generate Ditty</button>
        <p id="status" class="status"></p>
      </div>

      <div class="preview-panel">
        <div id="preview" class="preview">
          <video id="bgVideo" muted loop playsinline hidden></video>
          <img id="bgImage" alt="" hidden>
          <div id="previewFallback">Your preview appears here</div>
          <div id="caption">Your lyrics will appear here</div>
          <span class="watermark">REVIVAL</span>
        </div>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
